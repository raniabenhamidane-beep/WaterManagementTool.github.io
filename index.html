<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sika Water Action Tool</title>
<meta name="description" content="Water mitigation measures for Sika production sites in water-stressed areas.">
<link rel="icon" href="Logo_Sika_AG.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="rail" aria-hidden="true"></div>

<header class="top">
  <div class="top-text">
    <h1 data-i18n="appTitle">Water action tool</h1>
    <p class="intro" data-i18n="intro"></p>
  </div>
  <div class="top-side">
    <label class="lang">
      <span class="sr-only" data-i18n="language">Language</span>
      <select id="langSelect" aria-label="Language"></select>
    </label>
    <img class="logo" src="Logo_Sika_AG.webp" alt="Sika" width="64" height="56">
  </div>
</header>

<p class="draft" id="draftNote"><span data-i18n="draft"></span> <span data-i18n="contentNote"></span></p>

<main class="layout">
  <!-- 1. Site profile and filters -->
  <aside class="panel site" aria-labelledby="siteTitle">
    <details id="sitePanel" open>
      <summary><h2 id="siteTitle"><span class="step">1</span><span data-i18n="stepSite">Your site</span></h2></summary>

      <fieldset class="group">
        <legend data-i18n="production"></legend>
        <div class="chips" id="f-production"></div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="uses"></legend>
        <p class="hint" data-i18n="usesHint"></p>
        <div class="chips" id="f-uses"></div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="level"></legend>
        <div class="chips chips-col" id="f-level"></div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="type"></legend>
        <div class="chips chips-col" id="f-type"></div>
      </fieldset>

      <p class="saved" data-i18n="savedNote"></p>
    </details>

    <section class="done" aria-labelledby="doneTitle">
      <h2 id="doneTitle"><span class="step">3</span><span data-i18n="stepDone">Already in place</span> <span class="done-count" id="doneCount">0</span></h2>
      <ul id="doneList" class="done-list"></ul>
    </section>
  </aside>

  <!-- 2. Matrix and list -->
  <section class="panel results" aria-labelledby="measuresTitle">
    <div class="results-head">
      <h2 id="measuresTitle"><span class="step">2</span><span data-i18n="stepMeasures">Measures for your site</span></h2>
      <div class="results-actions">
        <button type="button" class="btn-ghost" id="resetBtn" data-i18n="reset">Show everything</button>
        <button type="button" class="btn-ghost" id="printBtn" data-i18n="print">Print my list</button>
      </div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>

    <div class="matrix-wrap">
      <div class="axis-y" aria-hidden="true">
        <span data-i18n="high"></span>
        <strong data-i18n="axisImpact"></strong>
        <span data-i18n="low"></span>
      </div>
      <div class="matrix" id="matrix" role="group" aria-labelledby="measuresTitle">
        <div class="quad q-quick"><b data-i18n="q_quick"></b></div>
        <div class="quad q-strategic"><b data-i18n="q_strategic"></b></div>
        <div class="quad q-secondary"><b data-i18n="q_secondary"></b></div>
        <div class="quad q-deprio"><b data-i18n="q_deprio"></b></div>
        <div id="markers"></div>
        <div class="tip" id="tip" role="tooltip"></div>
      </div>
      <div class="axis-x" aria-hidden="true">
        <span data-i18n="low"></span>
        <strong data-i18n="axisEffort"></strong>
        <span data-i18n="high"></span>
      </div>
    </div>

    <p class="empty" id="empty" hidden></p>
    <div id="lists"></div>
  </section>
</main>

<!-- Measure detail -->
<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="drawer-head">
    <div class="d-tags" id="dTags"></div>
    <button type="button" class="icon-btn" id="dClose"><span class="sr-only" data-i18n="close">Close</span><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot">
    <button type="button" class="btn-primary" id="dDone" data-i18n="markDone">We already do this</button>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button type="button" id="toastUndo" data-i18n="undo">Undo</button>
</div>

<!-- Printable list, filled before printing -->
<section class="print-only" id="printArea" aria-hidden="true"></section>

<script src="data/i18n.js"></script>
<script src="data/measures.js"></script>
<script src="app.js"></script>
</body>
</html>
